<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Helvetica', sans-serif; text-align: center; margin: 0; padding: 50px; }
        .hero { margin-bottom: 50px; }
        h1 { font-size: 3rem; letter-spacing: -2px; text-transform: uppercase; }
        #countdown { font-size: 2rem; color: #888; margin: 20px 0; font-family: monospace; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 800px; margin: 0 auto; }
        .item { background: #1a1a1a; padding: 20px; border: 1px solid #333; }
        footer { margin-top: 50px; font-size: 0.8rem; color: #444; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>I.L. COLECCIÓN</h1>
        <p>Drop 01 | Disponibilidad Limitada (9 Piezas)</p>
        <div id="countdown"></div>
    </div>

    <div class="gallery">
        <div class="item"><h3>Diseño 01</h3><p>Estética Distressed</p></div>
        <div class="item"><h3>Diseño 02</h3><p>Corte Baggy</p></div>
        <div class="item"><h3>Diseño 03</h3><p>Textil Premium</p></div>
    </div>

    <script>
        const countDownDate = new Date("Jun 4, 2026 18:30:00").getTime();
        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("countdown").innerHTML = d + "d " + h + "h " + m + "m " + s + "s ";
            if (distance < 0) { clearInterval(x); document.getElementById("countdown").innerHTML = "DROP ABIERTO"; }
        }, 1000);
    </script>
    <footer>© 2026 I.L. COLECCIÓN. EST. 2026</footer>
</body>
</html>
