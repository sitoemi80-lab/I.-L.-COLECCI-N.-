<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #000; color: #fff; font-family: 'Helvetica', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .hero { margin: 60px 0; }
        h1 { font-size: 4rem; letter-spacing: -4px; text-transform: uppercase; margin: 0; }
        #countdown { font-size: 2.5rem; color: #ff3333; margin: 20px 0; font-family: monospace; font-weight: bold; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        .item { background: #111; padding: 10px; border: 1px solid #222; transition: transform 0.3s; }
        .item:hover { transform: scale(1.02); border-color: #fff; }
        img { width: 100%; height: auto; display: block; filter: grayscale(20%); }
        .info { padding: 15px; text-align: left; }
        footer { margin-top: 80px; color: #555; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>I.L. COLECCIÓN</h1>
        <p>DROP 01 | DISPONIBILIDAD LIMITADA: 9 PIEZAS</p>
        <div id="countdown">Cargando...</div>
    </div>

    <div class="gallery">
        <!-- Reemplaza 'tu-imagen.jpg' por el nombre real de tus archivos -->
        <div class="item"><img src="tu-imagen-1.jpg" alt="Prenda 01"><div class="info"><h3>PIEZA 01</h3><p>Estética Distressed</p></div></div>
        <div class="item"><img src="tu-imagen-2.jpg" alt="Prenda 02"><div class="info"><h3>PIEZA 02</h3><p>Corte Baggy</p></div></div>
        <div class="item"><img src="tu-imagen-3.jpg" alt="Prenda 03"><div class="info"><h3>PIEZA 03</h3><p>Textil Premium</p></div></div>
    </div>

    <script>
        const countDownDate = new Date("Jun 4, 2026 18:30:00").getTime();
        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("countdown").innerHTML = d + "d " + h + "h " + m + "m " + s + "s ";
            if (distance < 0) { clearInterval(x); document.getElementById("countdown").innerHTML = "DROP ABIERTO"; }
        }, 1000);
    </script>
    <footer>© 2026 I.L. COLECCIÓN. EST. 2026</footer>
</body>
</html>
