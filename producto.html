<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle - I.L. COLECCIÓN</title>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        img { width: 100%; max-width: 400px; border: 1px solid #222; }
        .btn { background-color: #25D366; color: white; padding: 15px 30px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <h1 id="titulo">Producto</h1>
    <img id="imagen" src="" alt="Producto">
    <p>Precio: $399.00</p>
    <a id="btn-comprar" href="#" class="btn">PEDIR POR WHATSAPP 💬</a>
    <br><br>
    <a href="index.html" style="color:#aaa;">Volver al inicio</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const nombre = params.get('nombre');
        const img = params.get('img');
        document.getElementById('titulo').innerText = nombre;
        document.getElementById('imagen').src = img;
        document.getElementById('btn-comprar').href = "https://wa.me/525580830028?text=Hola!%20Me%20interesa%20la%20prenda:%20" + nombre;
    </script>
</body>
</html>
